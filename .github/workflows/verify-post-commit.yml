name: Temporary post-commit callback verification
on:
  push:
    branches:
      - feature/post-commit-replace-listeners
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check formatting
        run: |
          gofmt -d manager.go batch.go manager_committed_test.go
          test -z "$(gofmt -l manager.go batch.go manager_committed_test.go)"
      - name: Race tests
        run: go test -race -v ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
