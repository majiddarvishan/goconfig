name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core checks (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.18.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go mod download
      - run: bash .codex/check.sh

  hardening:
    name: Repeated, fuzz, and benchmark smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go mod download
      - run: go test -count=5 ./...
      - run: RUN_FUZZ=1 FUZZ_TIME=3s RUN_BENCHMARKS=1 BENCH_TIME=1x bash .codex/check.sh
